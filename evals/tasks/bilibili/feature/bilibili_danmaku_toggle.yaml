task:
  id: bilibili_danmaku_toggle
  description: 弹幕开关控制
  instruction: 在视频播放页面，找到弹幕开关按钮（通常位于播放器控制栏右侧，图标为弹幕样式或'弹'字），点击关闭弹幕，确认弹幕消失或弹幕区域变为透明。再次点击开启弹幕，确认弹幕重新出现并正常滚动。若弹幕按钮不可见，可先点击画面唤醒控制栏。
  tags:
  - feature
  - video
  timeout: 120
  graders:
  - type: state_check
    expect:
      elements_present:
      - 弹幕开关按钮
  - type: llm_rubric
    rubric: 弹幕开关功能正常：关闭后弹幕不再显示，开启后弹幕恢复显示。按钮状态与弹幕可见性一致。无UI卡死或异常。
  scoring:
    mode: weighted
    pass_threshold: 0.5
    weights:
      state_check: 0.3
      llm_rubric: 0.7
