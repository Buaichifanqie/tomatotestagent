task:
  id: bilibili_danmaku_toggle
  description: 切换弹幕开关
  instruction: 在哔哩哔哩App播放视频过程中，找到弹幕开关（通常是弹幕输入框旁边的开关），点击切换弹幕显示状态。先确保弹幕是开启状态（有弹幕显示），然后关闭弹幕，再开启。确认弹幕显示/隐藏切换成功。
  tags:
  - video
  - interaction
  timeout: 90
  graders:
  - type: llm_rubric
    rubric: Agent成功执行弹幕开关操作：关闭弹幕后视频上无弹幕浮层；重新开启后弹幕再次显示。4分以上通过。
  scoring:
    mode: weighted
    pass_threshold: 0.5
    weights:
      llm_rubric: 1.0
  setup:
  - action: launch_app
    params:
      package: tv.danmaku.bili
      activity: .MainActivity
