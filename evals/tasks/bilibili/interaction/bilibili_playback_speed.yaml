task:
  id: bilibili_playback_speed
  description: 视频播放倍速切换
  instruction: 在哔哩哔哩视频播放页面，点击屏幕弹出控制栏，找到倍速切换按钮（通常显示为「1x」或「倍速」）。点击进入倍速选择菜单，选择一个不同于当前的倍速（如2x）。确认播放速度改变，且倍速按钮上显示当前选择的倍速值。
  tags:
  - interaction
  - playback
  timeout: 150
  graders:
  - type: state_check
    expect:
      elements_present:
      - 2x
      - 倍速
  - type: llm_rubric
    rubric: 切换倍速后，视频应以新的速度播放（可观察画面进度变化速度），倍速按钮显示当前选择的倍速值（如2x）。倍速选项菜单应正常弹出并可选择其他倍速（0.5x,
      1.5x, 2x等）。
  scoring:
    mode: weighted
    pass_threshold: 0.5
    weights:
      state_check: 0.3
      llm_rubric: 0.7
