task:
  id: bilibili_danmaku_switch
  description: 弹幕开关切换
  instruction: 在哔哩哔哩视频播放页面，找到弹幕开关按钮（通常为「弹」字或弹幕图标），点击切换弹幕显示状态。确认弹幕开关状态发生变化（弹幕显示/隐藏），并且界面有对应的视觉反馈（如按钮颜色改变或文字提示）。
  tags:
  - interaction
  - playback
  timeout: 120
  graders:
  - type: state_check
    expect:
      elements_present:
      - 弹幕
  - type: llm_rubric
    rubric: 点击弹幕开关后，弹幕应切换显示/隐藏状态，按钮样式（如颜色或高亮）应反映当前状态。如果当前弹幕开启，再次点击应关闭弹幕，且画面上的弹幕消失。
  scoring:
    mode: weighted
    pass_threshold: 0.5
    weights:
      state_check: 0.2
      llm_rubric: 0.8
