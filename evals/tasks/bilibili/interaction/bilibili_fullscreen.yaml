task:
  id: bilibili_fullscreen
  description: 全屏播放功能验证
  instruction: 在哔哩哔哩App的视频播放页，点击播放器上的全屏按钮（通常右下角），等待播放器切换为全屏模式。然后退出全屏返回竖屏模式。
  tags:
  - interaction
  - video
  - playback
  - fullscreen
  timeout: 90
  graders:
  - type: llm_rubric
    rubric: Agent成功点击全屏按钮，播放器切换至全屏模式，显示全屏播放界面；再退出全屏，恢复竖屏播放界面。操作流畅无异常。得1-5分，4分及以上通过。
  scoring:
    mode: weighted
    pass_threshold: 0.5
    weights:
      llm_rubric: 1.0
  setup:
  - action: launch_app
    params:
      package: tv.danmaku.bili
      activity: .MainActivity
