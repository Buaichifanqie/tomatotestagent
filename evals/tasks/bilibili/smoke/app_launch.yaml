task:
  id: "bilibili_smoke_launch"
  description: "启动B站App，验证首页正确加载"
  instruction: "打开B站App，确认已经成功进入首页。验证底部导航栏和推荐内容可见。"
  tags: [smoke, core]
  timeout: 300
  setup:
    - action: launch_app
      params:
        package: "tv.danmaku.bili"
        activity: ".MainActivityV2"
  graders:
    - type: state_check
      expect:
        elements_present: ["首页", "推荐", "热门"]
    - type: llm_rubric
      rubric: |
        评分标准（1-5分，>=4通过）：
        - App 成功启动到首页
        - 底部导航栏可见（首页、热门、动态等）
        - 推荐内容列表可见
  scoring:
    mode: weighted
    pass_threshold: 0.5
    weights:
      state_check: 0.3
      llm_rubric: 0.7
