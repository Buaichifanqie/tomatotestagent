task:
  id: bilibili_tab_navigation
  description: 底部导航栏切换与页面加载
  instruction: 从首页开始，依次点击底部导航栏的'视频'、'动态'、'我的'选项卡，每切换一个页面后等待2秒，确认每个页面的主要元素加载（例如：视频页面应有视频列表；动态页面应有动态内容；我的页面应有用户头像或登录入口）。最后返回首页。
  tags:
  - smoke
  - core
  timeout: 60
  graders:
  - type: state_check
    expect:
      elements_present:
      - 视频页面视频列表
      - 动态页面内容
      - 我的页面用户头像或登录入口
  - type: llm_rubric
    rubric: 点击底部导航每个Tab后，对应的页面成功加载并显示内容，无长时间加载或空白页，返回首页后状态正常。
  scoring:
    mode: weighted
    pass_threshold: 0.5
    weights:
      state_check: 0.5
      llm_rubric: 0.5
