task:
  id: bilibili_app_start
  description: 应用启动与首页加载
  instruction: 打开哔哩哔哩App，等待首页完全加载。检查底部导航栏是否包含'首页'、'视频'、'动态'、'我的'等Tab，并确认页面顶部的搜索框或推荐内容可见。若出现开屏广告或新手引导弹窗，尝试关闭后继续。
  tags:
  - smoke
  - core
  timeout: 120
  graders:
  - type: state_check
    expect:
      elements_present:
      - 底部导航首页
      - 底部导航视频
      - 底部导航动态
      - 底部导航我的
      - 搜索框
  - type: llm_rubric
    rubric: App成功启动并显示首页内容，底部导航栏完整，搜索框可见，页面无异常白屏或崩溃。
  scoring:
    mode: weighted
    pass_threshold: 0.5
    weights:
      state_check: 0.4
      llm_rubric: 0.6
