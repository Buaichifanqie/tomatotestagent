task:
  id: bilibili_app_launch
  description: 启动App并检查首页
  instruction: 启动哔哩哔哩App，等待首页加载完成。确认首页推荐内容正确展示，包括视频推荐列表。
  tags:
  - smoke
  - core
  timeout: 90
  graders:
  - type: llm_rubric
    rubric: Agent成功启动App并看到首页内容，首页展示推荐视频列表或分类标签。未见登录弹窗或空白页。4分以上通过。
  scoring:
    mode: weighted
    pass_threshold: 0.5
    weights:
      llm_rubric: 1.0
  setup:
  - action: launch_app
    params:
      package: tv.danmaku.bili
      activity: .MainActivity
