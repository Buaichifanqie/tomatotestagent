task:
  id: bilibili_app_launch
  description: 验证App能否正常启动并显示首页
  instruction: 启动哔哩哔哩App，等待首页加载完成。检查首页是否显示推荐视频列表或频道导航。
  tags:
  - smoke
  - core
  timeout: 90
  graders:
  - type: llm_rubric
    rubric: Agent成功启动App，首页正常显示，无明显错误（如白屏、崩溃）。得1-5分，4分及以上通过。
  scoring:
    mode: weighted
    pass_threshold: 0.5
    weights:
      llm_rubric: 1.0
  setup:
  - action: launch_app
    params:
      package: tv.danmaku.bili
      activity: .MainActivity
