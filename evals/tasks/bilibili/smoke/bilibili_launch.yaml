task:
  id: bilibili_launch
  description: 启动 App 并确认首页显示
  instruction: 打开哔哩哔哩 App，等待首页加载完成，确认推荐视频列表可见。
  tags:
  - smoke
  - core
  timeout: 60
  graders:
  - type: llm_rubric
    rubric: 1分：App未启动或闪退；2分：启动但显示空白或异常页面；3分：启动但首页未完全加载；4分：首页正常显示推荐内容；5分：首页显示完整，推荐视频列表可见，底部导航栏显示。
  scoring:
    mode: weighted
    pass_threshold: 0.5
    weights:
      llm_rubric: 1.0
