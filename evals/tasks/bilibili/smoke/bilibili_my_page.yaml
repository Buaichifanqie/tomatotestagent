task:
  id: bilibili_my_page
  description: 导航到"我的"页面（已登录状态）
  instruction: 在首页底部导航栏点击“我的”标签，等待页面加载，确认页面顶部显示用户头像、昵称和等级信息。
  tags:
  - smoke
  - core
  timeout: 60
  graders:
  - type: llm_rubric
    rubric: 1分：点击后无响应或崩溃；2分：页面显示但未加载内容；3分：页面显示登录入口而非用户信息（即未登录）；4分：显示用户头像和昵称，但缺少等级或关注数；5分：完整显示用户头像、昵称、等级、关注/粉丝数，无登录提示。
  scoring:
    mode: weighted
    pass_threshold: 0.5
    weights:
      llm_rubric: 1.0
