task:
  id: bilibili_empty_search
  description: 空搜索或特殊字符搜索
  instruction: 在哔哩哔哩App中，点击搜索框，输入空字符串（直接点击搜索按钮），或者输入特殊字符如'@#$%'，执行搜索。观察App的响应，检查是否有合理的反馈（如提示'请输入搜索内容'或显示无结果页面）。
  tags:
  - edge
  - search
  timeout: 90
  graders:
  - type: llm_rubric
    rubric: Agent执行空搜索或特殊字符搜索后，App没有崩溃，且显示合理的用户提示（如'请输入搜索内容'或'没有找到相关结果'），或者直接返回搜索历史页面。4分以上通过。
  scoring:
    mode: weighted
    pass_threshold: 0.5
    weights:
      llm_rubric: 1.0
  setup:
  - action: launch_app
    params:
      package: tv.danmaku.bili
      activity: .MainActivity
