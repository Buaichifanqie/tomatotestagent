task:
  id: bilibili_search_empty
  description: 空搜索边界场景
  instruction: 在哔哩哔哩App首页，点击搜索框，不输入任何内容，直接点击搜索或确认。观察App反应。
  tags:
  - edge
  - search
  timeout: 90
  graders:
  - type: llm_rubric
    rubric: Agent执行空搜索操作，App应显示提示（如“请输入搜索内容”）或停留在搜索页面，不应崩溃或无响应。Agent能正确记录行为。得1-5分，4分及以上通过。
  scoring:
    mode: weighted
    pass_threshold: 0.5
    weights:
      llm_rubric: 1.0
  setup:
  - action: launch_app
    params:
      package: tv.danmaku.bili
      activity: .MainActivity
