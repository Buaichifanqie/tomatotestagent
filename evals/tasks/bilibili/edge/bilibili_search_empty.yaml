task:
  id: bilibili_search_empty
  description: 搜索不存在的关键词（空结果）
  instruction: 点击搜索按钮，在搜索框输入完全随机的字符“asdfghjklzxcvbnm”，点击搜索，确认页面提示“没有找到相关内容”或类似无结果提示。
  tags:
  - edge
  timeout: 60
  graders:
  - type: llm_rubric
    rubric: 1分：搜索无响应或崩溃；2分：搜索后加载异常或无限loading；3分：搜索后显示空白；4分：正确显示“没有找到相关内容”提示；5分：显示无结果提示并给出搜索建议或相关推荐。
  scoring:
    mode: weighted
    pass_threshold: 0.5
    weights:
      llm_rubric: 1.0
