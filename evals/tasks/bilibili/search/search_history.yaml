task:
  id: "bilibili_search_history"
  description: "检查搜索历史记录功能"
  instruction: "在B站搜索'科技'，返回首页，再点击搜索框，验证搜索历史中出现了历史记录。"
  tags: [search]
  timeout: 90
  setup:
    - action: launch_app
      params:
        package: "tv.danmaku.bili"
        activity: ".MainActivityV2"
  graders:
    - type: state_check
      expect:
        elements_present: ["搜索历史", "科技"]
    - type: llm_rubric
      rubric: |
        评分标准（1-5分，>=4通过）：
        - 完成一次搜索后返回首页
        - 再次点击搜索框时，搜索历史区域可见
        - 历史记录中包含刚才搜索的"科技"关键词
