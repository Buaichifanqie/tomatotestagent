task:
  id: "bilibili_search_empty"
  description: "搜索空字符串，验证App对空搜索的处理"
  instruction: "打开B站App，点击搜索框，不输入任何内容直接执行搜索。观察App对空搜索的反馈。"
  tags: [search, edge_case]
  timeout: 45
  setup:
    - action: launch_app
      params:
        package: "tv.danmaku.bili"
        activity: ".MainActivityV2"
  graders:
    - type: state_check
      expect:
        current_page: "search"
    - type: llm_rubric
      rubric: |
        评分标准（1-5分，>=4通过）：
        - App 正确处理空搜索输入（toast提示、或保持在页面）
        - 没有崩溃或异常退出
        - 用户能理解发生了什么
