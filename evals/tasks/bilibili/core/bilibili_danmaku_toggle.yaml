task:
  id: bilibili_danmaku_toggle
  description: 在播放视频时切换弹幕开关，验证弹幕显示变化
  instruction: 在视频播放页面，找到控制栏上的弹幕开关按钮（通常位于右侧）。点击弹幕开关使其关闭弹幕（图标变为灰色或斜线状态），等待2秒观察视频画面是否不再显示弹幕。再次点击弹幕开关开启弹幕，观察弹幕是否重新出现。
  tags:
  - core
  - video_playback
  timeout: 120
  graders:
  - type: state_check
    expect:
      elements_present:
      - 弹幕开关
      - 弹幕内容
  - type: llm_rubric
    rubric: 弹幕开关可正常切换开启/关闭状态，关闭时视频画面不再有弹幕内容，开启后弹幕恢复显示。
  scoring:
    mode: weighted
    pass_threshold: 0.5
    weights:
      state_check: 0.3
      llm_rubric: 0.7
