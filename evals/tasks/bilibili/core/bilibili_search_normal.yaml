task:
  id: bilibili_search_normal
  description: 正常关键词搜索并进入视频播放
  instruction: 在哔哩哔哩App首页，点击顶部搜索框，输入关键词「喵星人」，点击搜索。等待搜索结果加载，确认出现视频列表。然后点击第一个视频进入播放页。
  tags:
  - core
  - search
  - video
  timeout: 120
  graders:
  - type: llm_rubric
    rubric: Agent成功输入搜索词，搜索结果页面显示相关视频列表，点击第一个视频后进入视频详情页并开始播放（或显示播放界面）。得1-5分，4分及以上通过。
  scoring:
    mode: weighted
    pass_threshold: 0.5
    weights:
      llm_rubric: 1.0
  setup:
  - action: launch_app
    params:
      package: tv.danmaku.bili
      activity: .MainActivity
