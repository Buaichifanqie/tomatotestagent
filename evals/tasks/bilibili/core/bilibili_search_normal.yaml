task:
  id: bilibili_search_normal
  description: 正常搜索关键词并查看结果
  instruction: 在首页点击搜索框，进入搜索页面。输入关键词'测试视频'，点击搜索按钮或键盘搜索键。等待搜索结果加载，确认搜索结果列表包含至少一个视频条目，且视频标题或描述中包含关键词。可以滑动浏览结果。
  tags:
  - core
  - search
  timeout: 60
  graders:
  - type: state_check
    expect:
      elements_present:
      - 搜索结果列表
      - 视频标题
  - type: llm_rubric
    rubric: 搜索功能正常工作，输入关键词后能显示相关视频结果，结果列表不为空，且标题合理包含搜索词。无异常弹窗或错误提示。
  scoring:
    mode: weighted
    pass_threshold: 0.5
    weights:
      state_check: 0.3
      llm_rubric: 0.7
