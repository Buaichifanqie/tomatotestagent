task:
  id: bilibili_home_scroll
  description: 首页滑动加载更多
  instruction: 在哔哩哔哩App首页，向上滑动推荐列表，触发加载更多内容。等待新内容加载完成，检查页面是否展示更多视频卡片。
  tags:
  - core
  - navigation
  timeout: 90
  graders:
  - type: llm_rubric
    rubric: Agent成功执行向上滑动操作，首页推荐列表加载更多视频，新增视频卡片可见。滑动过程中无异常卡顿或闪退。4分以上通过。
  scoring:
    mode: weighted
    pass_threshold: 0.5
    weights:
      llm_rubric: 1.0
  setup:
  - action: launch_app
    params:
      package: tv.danmaku.bili
      activity: .MainActivity
