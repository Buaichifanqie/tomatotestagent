task:
  id: bilibili_search_video
  description: 搜索视频并查看结果
  instruction: 在哔哩哔哩App中，点击搜索框（通常在顶部），输入'测试视频'，执行搜索。等待搜索结果页面加载，确认至少显示一个视频结果。
  tags:
  - core
  - search
  timeout: 90
  graders:
  - type: llm_rubric
    rubric: Agent成功执行搜索，搜索结果页面显示至少一个视频或专栏内容。搜索框显示输入的关键词。4分以上通过。
  scoring:
    mode: weighted
    pass_threshold: 0.5
    weights:
      llm_rubric: 1.0
  setup:
  - action: launch_app
    params:
      package: tv.danmaku.bili
      activity: .MainActivity
