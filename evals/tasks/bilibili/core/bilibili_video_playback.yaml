task:
  id: bilibili_video_playback
  description: 播放视频并检查播放器
  instruction: 在哔哩哔哩App首页推荐视频列表中，点击第一个视频进入播放页面。等待视频开始播放，确认播放器控制栏可见（如进度条、暂停/播放按钮）。
  tags:
  - core
  - video
  timeout: 120
  graders:
  - type: llm_rubric
    rubric: Agent成功打开视频并进入播放界面，视频正在播放且播放器控制元素可见（如暂停按钮、进度条、弹幕开关等）。4分以上通过。
  scoring:
    mode: weighted
    pass_threshold: 0.5
    weights:
      llm_rubric: 1.0
  setup:
  - action: launch_app
    params:
      package: tv.danmaku.bili
      activity: .MainActivity
